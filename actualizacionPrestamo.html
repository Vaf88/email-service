<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualización de préstamo – LIS</title>

    <!-- Librería EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #0b6e4f;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #0b6e4f;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #09543c;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Actualización de préstamo – LIS</h2>

    <form id="loanUpdateForm">

        <label>Nombre completo del estudiante</label>
        <input type="text" id="student_name" required>

        <label>Documento</label>
        <input type="text" id="student_document" required>

        <label>Correo del estudiante</label>
        <input type="email" id="student_email" required>

        <label>Objeto(s)</label>
        <input type="text" id="items" required>

        <label>Código(s) del objeto</label>
        <input type="text" id="items_codes" required>

        <label>Fecha inicial del préstamo</label>
        <input type="date" id="loan_start" required>

        <label>Fecha anterior de devolución</label>
        <input type="date" id="previous_due" required>

        <label>Nueva fecha de devolución</label>
        <input type="date" id="new_due" required>

        <label>Motivo / Observación</label>
        <textarea id="reason" required></textarea>

        <label>Auxiliar que aprueba</label>
        <input type="text" id="staff_name" required>

        <button type="submit">Enviar correo</button>

    </form>
</div>

<script src="script.js"></script>

</body>
</html>
